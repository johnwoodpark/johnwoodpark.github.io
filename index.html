<script>
const emailText = "parkjohnwood@gmail.com";

function copyEmail() {
    const email = document.getElementById("email-copy");

    navigator.clipboard.writeText(emailText)
        .then(showCopied)
        .catch(() => {
            email.textContent = "(copy failed)";
            setTimeout(() => {
                email.textContent = emailText;
            }, 800);
        });

    function showCopied() {
        clearTimeout(window.copyTimeout);

        email.textContent = "(copied!)";

        window.copyTimeout = setTimeout(() => {
            email.textContent = emailText;
        }, 800);
    }
}
</script>
